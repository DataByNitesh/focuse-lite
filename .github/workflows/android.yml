# Builds FocusLite on GitHub's servers on every push.
# Result: Actions tab → latest run → Artifacts → "FocusLite-debug-apk" (a zip containing app-debug.apk).
name: Build FocusLite

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: write # needed to create Releases

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Unit tests (rule engine, policy)
        run: bash ./gradlew --no-daemon testDebugUnitTest

      - name: Build debug APK
        run: bash ./gradlew --no-daemon assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: FocusLite-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      # On every push to main, publish the APK as a GitHub Release so it can be
      # downloaded and installed directly on the phone (repo page → Releases).
      - name: Rename APK
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: cp app/build/outputs/apk/debug/app-debug.apk FocusLite-build-${{ github.run_number }}.apk

      - name: Publish release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: FocusLite build ${{ github.run_number }}
          body: |
            Debug build from commit ${{ github.sha }}.
            Install: open this page on your phone, tap the .apk, allow installing from your browser.
            Then in Android Settings → Apps → FocusLite → ⋮ → "Allow restricted settings" before enabling accessibility.
          files: FocusLite-build-${{ github.run_number }}.apk
          make_latest: true

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: app/build/reports/tests/
          if-no-files-found: ignore
